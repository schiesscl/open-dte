<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - OpenDTE ERP</title>
    
    <!-- Estos recursos sí cargan offline gracias al caché del Service Worker -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100">

    <div class="text-center shadow-lg p-5 bg-white rounded">
        <img src="/static/img/logo.webp" alt="Logo OpenDTE" height="80" class="mb-4">
        
        <h1 class="display-1 text-secondary mb-3"><i class="bi bi-wifi-off"></i></h1>
        <h2 class="text-dark fw-bold">Modo Desconectado</h2>
        <p class="text-muted fs-5 mt-2">Parece que no tienes conexión a internet en este momento.</p>
        <p class="text-muted">El sistema sigue aquí, pero tu dispositivo necesita red para continuar operando en la base de datos.</p>
        
        <!-- Botón para intentar conectar nuevamente -->
        <button onclick="window.location.reload()" class="btn btn-fs-yellow fw-bold px-4 py-2 mt-4 shadow-sm">
            <i class="bi bi-arrow-clockwise"></i> Reintentar Conexión
        </button>
    </div>

</body>
</html>
